# List application projects below; select one in the CMSIS UI and regenerate ai_layer.
solution:
  created-for: CMSIS-Toolbox@2.14.1
  cdefault:
  compiler: AC6
  packs:
    - pack: AlifSemiconductor::Ensemble@^2.2.0-0
    - pack: ARM::CMSIS@^6.2.0
    - pack: ARM::CMSIS-Compiler@^2.1.0
    - pack: PyTorch::ExecuTorch@1.4.1
    - pack: ARM::CMSIS-NN
    - pack: ARM::ethos-u-core-driver@1.26.5
  target-types:
    - type: DevKit-E8
      board: DevKit-E8
      device: AE822FA0E5597LS0
      memory:
        - name: OSPI_FLASH
          access: rx
          start: 0xC0000000
          size: 0x02000000
      variables:
        - Board-Layer: $SolutionDir()$/board/DevKit-E8/Board_HP-U85.clayer.yml
        - AI-Layer: $SolutionDir()$/ai_layer/ai_layer.clayer.yml
      target-set:
        - set: Debug
          images:
            - project-context: template_mram.Debug
          debugger:
            name: ULINKplus@pyOCD
            clock: 10000000
            protocol: swd
        - set: Release
          images:
            - project-context: template_mram.Release
          debugger:
            name: ULINKplus@pyOCD
            clock: 10000000
            protocol: swd
        - set: OSPI_Debug
          images:
            - project-context: template_ospi.Debug
          debugger:
            name: ULINKplus@pyOCD
            clock: 10000000
            protocol: swd
        - set: OSPI_Release
          images:
            - project-context: template_ospi.Release
          debugger:
            name: ULINKplus@pyOCD
            clock: 10000000
            protocol: swd
        - set: ProgramModel
          images:
            - project-context: template_ospi.ProgramModel
          debugger:
            name: ULINKplus@pyOCD
            clock: 10000000
            protocol: swd
  build-types:
    - type: ProgramModel
      debug: on
      optimize: none
      define:
        - MODEL_PROGRAMMING_MODE: 1
    - type: Debug
      debug: on
      optimize: none
    - type: Release
      debug: on
      optimize: speed
      misc:
        - for-compiler: AC6
          C-CPP:
            - -O3
            - -ffast-math
  projects:
    - project: projects/template_mram/template_mram.cproject.yml
      for-context:
        - .Debug
        - .Release
    - project: projects/template_ospi/template_ospi.cproject.yml
  mlops:
    description: Ethos-U85 hello world
    npu:
      type: Ethos-U85
      macs: 256
    model:
      clayer: $AI-Layer$
