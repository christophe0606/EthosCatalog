# Each application owns its generated ai_layer; select a target set in the CMSIS UI.
solution:
  created-for: CMSIS-Toolbox@2.14.1
  cdefault:
  compiler: AC6
  packs:
    - pack: AlifSemiconductor::Ensemble@^2.2.0-0
    - pack: ARM::CMSIS@^6.2.0
    - pack: ARM::CMSIS-DSP@1.18.0
    - pack: ARM::CMSIS-STREAM
      path: thirdparty/CMSIS-Stream
    - pack: ARM::CMSIS-Compiler@^2.1.0
    - pack: PyTorch::ExecuTorch@1.4.1
    - pack: ARM::CMSIS-NN
    - pack: ARM::ethos-u-core-driver@1.26.5
  target-types:
    - type: DevKit-E8
      board: DevKit-E8
      device: AE822FA0E5597LS0
      memory:
        - name: OSPI_FLASH
          access: rx
          start: 0xC0000000
          # Bounded model loader; the fitted device has another 64 MiB below.
          size: 0x04000000
          algorithm: board/flash/DevKit-E8_IS25WX.FLM
          ram-start: 0x00000000
          ram-size: 0x00040000
        - name: OSPI_FLASH_REMAINDER
          access: rx
          start: 0xC4000000
          size: 0x04000000
      variables:
        - Board-Layer: $SolutionDir()$/board/DevKit-E8/Board_HP-U85.clayer.yml
      target-set:
        - set: Debug
          images:
            - project-context: template_mram.Debug
          debugger:
            name: ULINKplus@pyOCD
            clock: 10000000
            protocol: swd
        - set: Release
          images:
            - project-context: template_mram.Release
          debugger:
            name: ULINKplus@pyOCD
            clock: 10000000
            protocol: swd
        - set: OSPI_Debug
          images:
            - project-context: template_ospi.Debug
          debugger:
            name: ULINKplus@pyOCD
            clock: 10000000
            protocol: swd
        - set: OSPI_Release
          images:
            - project-context: template_ospi.Release
          debugger:
            name: ULINKplus@pyOCD
            clock: 10000000
            protocol: swd
        - set: ProgramModel
          images:
            - project-context: template_ospi.ProgramModel
          debugger:
            name: ULINKplus@pyOCD
            clock: 10000000
            protocol: swd
        - set: Phonon_Debug
          images:
            - project-context: phonon_31m_en.Debug
          debugger:
            name: ULINKplus@pyOCD
            clock: 10000000
            protocol: swd
        - set: Handwriting_Debug
          images:
            - project-context: handwriting_synthesis.Debug
          debugger:
            name: ULINKplus@pyOCD
            clock: 10000000
            protocol: swd
        - set: Handwriting_Release
          images:
            - project-context: handwriting_synthesis.Release
          debugger:
            name: ULINKplus@pyOCD
            clock: 10000000
            protocol: swd
        - set: Handwriting_ProgramModel
          images:
            - project-context: handwriting_synthesis.ProgramModel
          debugger:
            name: ULINKplus@pyOCD
            clock: 10000000
            protocol: swd
        - set: Phonon_Release
          images:
            - project-context: phonon_31m_en.Release
          debugger:
            name: ULINKplus@pyOCD
            clock: 10000000
            protocol: swd
        - set: Phonon_ProgramModel
          images:
            - project-context: phonon_31m_en.ProgramModel
          debugger:
            name: ULINKplus@pyOCD
            clock: 10000000
            protocol: swd
        - set: FlashLoader
          images:
            - project-context: FlashLoader.FlashLoader
        - set: KWS_Debug
          images:
            - project-context: kws_micronet_l.Debug
          debugger:
            name: ULINKplus@pyOCD
            clock: 10000000
            protocol: swd
        - set: KWS_Release
          images:
            - project-context: kws_micronet_l.Release
          debugger:
            name: ULINKplus@pyOCD
            clock: 10000000
            protocol: swd
        - set: Detection_Debug
          images:
            - project-context: object_detection.Debug
          debugger:
            name: ULINKplus@pyOCD
            clock: 10000000
            protocol: swd
        - set: Detection_Release
          debugger:
            name: ULINKplus@pyOCD
            clock: 10000000
            protocol: swd
          images:
            - project-context: object_detection.Release
  build-types:
    - type: FlashLoader
      debug: on
      optimize: none
    - type: ProgramModel
      debug: on
      optimize: none
      define:
        - MODEL_PROGRAMMING_MODE: 1
    - type: Debug
      debug: on
      optimize: none
    - type: Release
      debug: on
      optimize: speed
      misc:
        - for-compiler: AC6
          C-CPP:
            - -O3
            - -ffast-math
  projects:
    - project: projects/template_mram/template_mram.cproject.yml
      for-context:
        - .Debug
        - .Release
    - project: projects/template_ospi/template_ospi.cproject.yml
    - project: projects/kws_micronet_l/kws_micronet_l.cproject.yml
      for-context:
        - .Debug
        - .Release
    - project: projects/object_detection/object_detection.cproject.yml
      for-context:
        - .Debug
        - .Release
    - project: projects/phonon_31m_en/phonon_31m_en.cproject.yml
    - project: projects/handwriting_synthesis/handwriting_synthesis.cproject.yml
    - project: board/flash/loader/FlashLoader.cproject.yml
      for-context:
        - .FlashLoader
  mlops:
    description: Ethos-U85 network demos and benchmarks for Alif DevKit-E8
    npu:
      type: Ethos-U85
      macs: 256
