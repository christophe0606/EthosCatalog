$schema: https://json-schema.org/draft/2020-12/schema
title: EthosCatalog network configuration
description: Project-owned model sources, quantization provenance, quantized caches, model storage and Vela configuration.
type: object
additionalProperties: false
required:
- network
properties:
  network:
    type: object
    additionalProperties: false
    required:
    - name
    - model
    - quantize
    - quantization
    - flash_ospi
    - vela
    oneOf:
    - required: [graph, safetensors]
      not:
        required: [methods]
    - required: [methods]
      not:
        anyOf:
        - required: [graph]
        - required: [safetensors]
    properties:
      name:
        $ref: '#/$defs/text'
        description: Human-readable network name.
      model:
        $ref: '#/$defs/text'
        description: Model source path, relative to and contained within the project directory.
      quantize:
        $ref: '#/$defs/text'
        description: Project quantization or import script path, relative to and contained within the project directory.
      quantization:
        type: object
        additionalProperties: false
        required:
        - type
        - quantization
        - error
        properties:
          type:
            type: string
            enum:
            - quantization_aware_training
            - post_training_quantization
            description: Quantization method; current catalog projects use post_training_quantization only.
          quantization:
            type: string
            enum:
            - full
            - partial
            - already
            - synthetic
            description: "Calibration provenance: full or partial original-source test patterns, an already quantized network, or synthetic data."
          error:
            description: >-
              Network-dependent error or quality measurements, with no prescribed
              type, structure, metric names, units or ranges. May contain a scalar,
              list, matrix, mapping of multiple metrics, or null when unavailable.
              Describe metrics, units, references and evaluation inputs in the value
              or YAML comments. For already quantized networks, report a comparison
              against float only if provided by the original source.
      safetensors:
        $ref: '#/$defs/text'
        description: Quantized tensor cache path, relative to and contained within the project directory.
      graph:
        $ref: '#/$defs/text'
        description: Companion exported .pt2 graph path, relative to and contained within the project directory.
      methods:
        type: object
        minProperties: 1
        description: Named method caches instead of the single forward graph/tensor pair. All methods are serialized into one PTE.
        propertyNames:
          pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
        additionalProperties:
          type: object
          additionalProperties: false
          required: [graph, safetensors]
          properties:
            graph:
              $ref: '#/$defs/text'
            safetensors:
              $ref: '#/$defs/text'
            delegate:
              type: boolean
              default: true
              description: False explicitly permits this method to run only on CPU. Other methods must contain an Ethos delegate.
      flash_ospi:
        type: boolean
        description: Whether the model is programmed separately into the OSPI partition.
      assets:
        type: object
        minProperties: 1
        description: Additional immutable model assets programmed within the same OSPI partition.
        propertyNames:
          pattern: '^[a-z][a-z0-9_]*$'
        additionalProperties:
          type: object
          additionalProperties: false
          required: [file, address]
          properties:
            file:
              $ref: '#/$defs/text'
            address:
              type: integer
              minimum: 0
      ospi:
        type: object
        additionalProperties: false
        required:
        - address
        - size
        properties:
          address:
            type: integer
            minimum: 0
            description: Model partition start address in bytes; YAML hexadecimal integers are accepted.
          size:
            type: integer
            minimum: 1
            description: Reserved model partition size in bytes; YAML hexadecimal integers are accepted.
          pname:
            $ref: '#/$defs/text'
            description: Optional CMSIS processor name; the model flash script defaults to M55_HP.
      vela:
        type: object
        additionalProperties: false
        required:
        - ini
        - system_config
        - memory_mode
        properties:
          ini:
            $ref: '#/$defs/text'
            description: Vela configuration path, relative to the project directory; may refer outside the project.
          system_config:
            $ref: '#/$defs/text'
            description: System configuration name in the Vela ini file.
          memory_mode:
            $ref: '#/$defs/text'
            description: Memory mode name in the Vela ini file.
    dependentSchemas:
      assets:
        properties:
          flash_ospi:
            const: true
    if:
      required:
      - flash_ospi
      properties:
        flash_ospi:
          const: true
    then:
      required:
      - ospi
$defs:
  text:
    type: string
    minLength: 1
    pattern: \S
