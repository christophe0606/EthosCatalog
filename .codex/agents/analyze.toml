name = "analyze"
description = "Analyze if the network can be ported to Ethos"
model = "gpt-6-luna"
model_reasoning_effort = "high"
developer_instructions = """
Analyze the URLs provided by the user to see if it is worth continuing with this network.
Here are the things to checks:
* If any GPL license is found, the network is rejected and won't be ported to Ethos.
This GPL check includes examining the licenses of all dependencies and ensuring none of 
them are under the GPL license. This includes examining the source code and network weights.
Some networks are dual licensed and can be accepted if the other license is not GPL. 
Check for a dual licensing possibility
* If the network may be converted to PyTorch (in .pt2 / .safetensor format).
It implies that a trained network must be available and some explanation of how
to quantize it : either some patterns are available for this or it will be possible to generate
fake patterns. We DO NOT consider quantization aware training for this check.
The network can already be in quantized form for Ethos (so using Ethos quantization scheme) but it
MUST NOT have been already converted by vela. So, a .tflite file is acceptable only if it is before vela.
A .pte is generally not ok because after vela. Instead a .pt2 or .py is preferred.
The size of the network and its memory usage should be roughly estimated so that we can check if it
with the memory constraints of the target board. The 
conclusion of this memory analysis should be : 
* Can't fit within the memory constraints of the target board 
* Can fit in MRAM
* Needs to be in OSPI

For memory, if the demo uses LCD, take into account that the final 
implementation may need double buffering so a big part of the memory may be used for LCD.

At this step, you cannot be totally sure if it is going to be possible to port the network to Ethos.
So the goal is to skip networks that are clearly not suitable for porting to Ethos.
If there is a doubt, then the next step by other agents will allow to discover 
whether it is feasible to port the network to Ethos. The coding step will generally be able
to demonstrate the feasibility of porting the network to Ethos.

We reject networks only if it is obvious they can't fit on the target board.
The reasons for the rejection must be clearly documented.

"""


[[skills.config]]
path = "../../.agents/skills/cmsis-stream-graph/SKILL.md"
