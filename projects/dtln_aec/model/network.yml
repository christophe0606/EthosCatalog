network:
  name: DTLN-aec 128
  model: model/model.py
  quantize: model/quantize.py
  quantization:
    type: post_training_quantization
    quantization: synthetic
    error:
      calibration_frames: 2000
      evaluation_frames: 128
      float_shared_state_nonzero_max_absolute_error:
      - 2.86102294921875e-05
      - 1.52587890625e-05
      float_shared_state_zero_input_max_absolute_error:
      - 2.8487701416015625
      - 1.52587890625e-05
      activation: int16 at linear operators; spectral features, nonlinearities and
        recurrent state updates float32
      weights: per-channel int8 for linear operators
      data: 16 seconds of continuous synthetic near/far audio with varying signal
        levels, frequency, two echo delays and silence, echo-only, near-only and double-talk
        transitions; calibration seed 578 and held-out method evaluation seed 901
      limitation: Synthetic numeric conversion checks do not establish speech quality
        or AEC challenge scores.
      stage1:
        output_mae: 0.0008612109057848268
        output_max_absolute_error: 0.03142327070236206
        state_mae: 0.006133988827153466
        state_max_absolute_error: 0.3862895965576172
      stage2:
        output_mae: 0.00014884598751496725
        output_max_absolute_error: 0.0058657387271523476
        state_mae: 0.007651073382060704
        state_max_absolute_error: 0.6326465606689453
  methods:
    stage1:
      graph: model/stage1_quantized.pt2
      safetensors: model/stage1_quantized.safetensors
    stage2:
      graph: model/stage2_quantized.pt2
      safetensors: model/stage2_quantized.safetensors
  flash_ospi: true
  ospi:
    address: 3284140032
    size: 4194304
    pname: M55_HP
  vela:
    ini: ../../.cmsis/ensemble_vela.ini
    system_config: Ethos_U85_SRAM_OSPI
    memory_mode: Shared_Sram
