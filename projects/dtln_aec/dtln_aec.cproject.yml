project:
  device: :M55_HP
  packs:
    - pack: ARM::CMSIS-RTX@^5.9.0
    - pack: ARM::SDS@3.1.0
      for-context: [.Debug, .Release, .ReleaseSRAM]
  add-path:
    - .
    - ../../common
    - ../../common/stream
    - ../../common/nodes_impl/c
    - generated
    - ../../board/DevKit-E8/RTE/Device/AE822FA0E5597LS0_M55_HP
    - ../../board/DevKit-E8/RTE/BSP/AE822FA0E5597LS0_M55_HP
  define:
    - NPU_QCONFIG: 2
    - NPU_REGIONCFG_0: 3
    - NPU_REGIONCFG_1: 0
    - APP_MODEL_OSPI
    - APP_METHOD_POOL_SIZE: 262144
    - APP_TEMP_POOL_SIZE: 524288
    - APP_READ_CLOCK_HZ: 100000000
    - APP_POOL_SECTION: \".bss.ai_pool\"
    - OS_THREAD_NUM: 7
    - OS_DYNAMIC_MEM_SIZE: 65536
  setups:
    - setup: Direct OSPI weights
      for-context: [.Debug, .Release, .ProgramModel]
      define:
        - NPU_MEM_ATTR_2: 0x24
        - NPU_MEM_ATTR_3: 0x24
    - setup: SRAM0 weights
      for-context: [.ReleaseSRAM]
      define:
        - DTLN_MODEL_IN_SRAM: 1
        - DTLN_USE_FAST_CPU_KERNELS: 1
        - NPU_MEM_ATTR_2: 0x20
        - NPU_MEM_ATTR_3: 0x20
  components:
    - component: BSP:OSPI FLASH XIP:core
    - component: BSP:External peripherals:GT911 Touch Controller
      for-context: [.Debug, .Release, .ReleaseSRAM]
    - component: CMSIS:RTOS2:Keil RTX5&Source
    - component: CMSIS:OS Tick:SysTick
    - component: CMSIS:STREAM&Source
      for-context: [.Debug, .Release, .ReleaseSRAM]
    - component: CMSIS:DSP&Source
      for-context: [.Debug, .Release, .ReleaseSRAM]
      optimize: speed
      misc:
        - C-CPP: [-O3, -ffast-math]
  connections:
    - connect: DTLN-aec application
      provides:
        - CMSIS-RTOS2
  linker:
    - script: linker_ac6.sct.src
      for-compiler: AC6
    - script: linker_clang.ld.src
      for-compiler: CLANG
    - regions: ../../board/DevKit-E8/RTE/Device/AE822FA0E5597LS0_M55_HP/app_mem_regions.h
  misc:
    - for-compiler: AC6
      C: [-ffunction-sections, -fdata-sections]
      CPP: [-ffunction-sections, -fdata-sections]
      Link: [--remove]
    - CPP: [-std=gnu++17, -Wno-deprecated-declarations, -fno-color-diagnostics]
  groups:
    - group: ExecuTorch CPU operator overrides
      for-context: [.ReleaseSRAM]
      files:
        - file: ../midi_ddsp/kernels/normalization.cpp
        - file: ../midi_ddsp/kernels/quantization.cpp
    - group: DTLN streaming demo
      for-context: [.Debug, .Release, .ReleaseSRAM]
      files:
        - file: demo.cpp
          add-path:
            - $Pack(ARM::SDS)$/sds/sdsio/client
        - file: sds_usb_tx.c
          for-compiler: AC6
          add-path:
            - $Pack(ARM::SDS)$/sds/sdsio/client
        - file: waveform_display.cpp
        - file: ../../common/nodes_impl/alif_e8/lcd.c
        - file: hardware_params.cpp
        - file: hardware_params.h
        - file: datatypes.h
        - file: stream_types.h
        - file: generated/scheduler_app.cpp
        - file: generated/app_params.c
        - file: ../../common/nodes_impl/c/sliding_buffer.c
        - file: ../../common/nodes_impl/c/fft.c
    - group: OSPI startup and programming preparation
      files:
        - file: ospi_startup.c
        - file: ../../board/DevKit-E8/model_storage.c
        - file: ../../board/DevKit-E8/e8_issi_flash.c
    - group: DTLN inference and independent method benchmarks
      for-context: [.Debug, .Release, .ReleaseSRAM]
      files:
        - file: app_main.cpp
        - file: benchmark.cpp
        - file: benchmark.h
        - file: dtln_runtime.cpp
        - file: dtln_runtime.h
        - file: model/integer_test_data.h
        - file: model/model_test_data.h
        - file: ../../common/arm_embedded_module.cpp
        - file: ../../common/arm_embedded_module.hpp
        - file: ../../common/embedded_runtime.hpp
        - file: ../../common/nodes_impl/c/embedded_runtime.cpp
  layers:
    - layer: $Board-Layer$
      type: Board
    - layer: $DTLN-SDS-Layer$
      type: SDSIO
      for-context: [.Debug, .Release, .ReleaseSRAM]
    - layer: ai_layer/ai_layer.clayer.yml
      type: AI
      for-context: [.Debug, .Release, .ReleaseSRAM]
  output:
    type: [elf, bin, hex, map]
