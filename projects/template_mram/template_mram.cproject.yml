project:
  device: :M55_HP
  packs:
    - pack: ARM::CMSIS-RTX@^5.9.0
  add-path:
    - .
    - ../../common
    - ../../board/DevKit-E8
    - ../../board/DevKit-E8/RTE/Device/AE822FA0E5597LS0_M55_HP
    - ../../board/DevKit-E8/RTE/BSP/AE822FA0E5597LS0_M55_HP
  define:
    # Shared_Sram: arena uses AXI0 SRAM, constants use AXI1 MRAM.
    # Driver MEM_ATTR 2/3 select EXT (MRAM), 0/1 select SRAM.
    - NPU_QCONFIG: 2
    - NPU_REGIONCFG_0: 3
    - NPU_REGIONCFG_1: 0
    - APP_METHOD_POOL_SIZE: 65536
    - APP_TEMP_POOL_SIZE: 65536
    # Main application + dedicated audio and LCD threads use C library state.
    - OS_THREAD_NUM: 3
    - APP_POOL_SECTION: \".bss.ai_pool\"
  components:
    - component: CMSIS:RTOS2:Keil RTX5&Source
    - component: CMSIS:OS Tick:SysTick
    - component: CMSIS-Compiler:TTY:Custom
    - component: CMSIS:DSP&Source
      optimize: speed
      misc:
        - C-CPP: [-O3, -ffast-math]
    - component: Device:SOC Peripherals:PDM
    - component: BSP:External peripherals:GT911 Touch Controller
  connections:
    - connect: MRAM template application
      provides:
        - CMSIS-RTOS2
  linker:
    - script: linker_ac6.sct.src
      for-compiler: AC6
    - regions: ../../board/DevKit-E8/RTE/Device/AE822FA0E5597LS0_M55_HP/app_mem_regions.h
  misc:
    - for-compiler: AC6
      C: [-ffunction-sections, -fdata-sections]
      CPP: [-ffunction-sections, -fdata-sections]
      Link: [--remove]
    - CPP: [-std=gnu++17, -Wno-deprecated-declarations]
  groups:
    - group: MRAM template
      files:
        - file: app_main.cpp
        - file: model/model_test_data.h
        - file: spectrum.h
        - file: spectrum_ui.c
    - group: Embedded ExecuTorch module
      files:
        - file: ../../common/arm_embedded_module.cpp
        - file: ../../common/arm_embedded_module.hpp
    - group: Reusable processing nodes
      files:
        - file: ../../common/nodes.h
        - file: ../../common/board_nodes.h
        - file: ../../common/embedded_runtime.hpp
        - file: ../../common/nodes_impl/c/embedded_runtime.cpp
        - file: ../../common/nodes_impl/c/sliding_buffer.c
        - file: ../../common/nodes_impl/c/window.c
        - file: ../../common/nodes_impl/c/fft.c
        - file: ../../common/nodes_impl/alif_e8/microphone.c
        - file: ../../common/nodes_impl/alif_e8/lcd.c
  layers:
    - layer: $Board-Layer$
      type: Board
    - layer: $AI-Layer$
      type: AI
  output:
    type: [elf, bin, hex, map]
