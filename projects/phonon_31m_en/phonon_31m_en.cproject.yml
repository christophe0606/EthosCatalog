project:
  device: :M55_HP
  packs:
    - pack: ARM::CMSIS-RTX@^5.9.0
  add-path:
    - .
    - ../../common
    - ../../common/stream
    - generated
    - ../../board/DevKit-E8/RTE/Device/AE822FA0E5597LS0_M55_HP
    - ../../board/DevKit-E8/RTE/BSP/AE822FA0E5597LS0_M55_HP
  define:
    # U85 MEM_ATTR_2/3 route command stream and weights to AXI_EXT (OSPI).
    # Backend NPU I/O and scratch use SRAM. CPU tensors/state use verified
    # HyperRAM, with backend copies between CPU tensors and SRAM for delegates.
    - NPU_QCONFIG: 2
    - NPU_REGIONCFG_0: 3
    - NPU_REGIONCFG_1: 0
    # Normal non-cacheable, non-bufferable EXT reads (AxCACHE=0010).
    - NPU_MEM_ATTR_2: 0x24
    - NPU_MEM_ATTR_3: 0x24
    - APP_MODEL_OSPI
    - APP_MODEL_PARTITION_BYTES: 0x04000000
    # Measured full backbone+synthesis metadata peak 165992 bytes.
    - APP_METHOD_POOL_SIZE: 262144
    - APP_TEMP_POOL_SIZE: 1572864
    # Bounded legal comparison: fitted flash <=166 MHz; either RAM grade >=166 MHz.
    - PHONON_FLASH_HZ: 100000000
    - PHONON_PSRAM_HZ: 100000000
    # Match the selected Vela Dedicated_Sram artifact and bind base2 in SRAM.
    - PHONON_DEDICATED_SRAM: 1
    # RTX thread budget for the benchmark and later UART/audio application.
    - OS_THREAD_NUM: 3
    - OS_DYNAMIC_MEM_SIZE: 65536
    - APP_POOL_SECTION: \".bss.ai_pool\"
  components:
    - component: BSP:OSPI FLASH XIP:core
    - component: BSP:OSPI PSRAM XIP
      for-context: [.Debug, .Release]
    - component: BSP:OSPI PSRAM XIP:APS PSRAM
      for-context: [.Debug, .Release]
      misc:
        - C: [-include, phonon_psram_config.h]
    - component: Device:SOC Peripherals:OSPI
      for-context: [.Debug, .Release]
    - component: CMSIS:RTOS2:Keil RTX5&Source
    - component: CMSIS:OS Tick:SysTick
    - component: CMSIS:DSP&Source
      optimize: speed
      misc:
        - C-CPP: [-O3, -ffast-math]
    - component: Device:SOC Peripherals:PDM
    - component: BSP:External peripherals:GT911 Touch Controller
  connections:
    - connect: Phonon TTS hardware benchmark
      provides:
        - CMSIS-RTOS2
  linker:
    - script: linker_ac6.sct.src
      for-compiler: AC6
    - script: linker_clang.ld.src
      for-compiler: CLANG
    - regions: ../../board/DevKit-E8/RTE/Device/AE822FA0E5597LS0_M55_HP/app_mem_regions.h
  misc:
    - for-compiler: AC6
      C: [-ffunction-sections, -fdata-sections]
      CPP: [-ffunction-sections, -fdata-sections]
      Link: [--remove]
    - CPP: [-std=gnu++17, -Wno-deprecated-declarations, -fno-color-diagnostics]
  groups:
    - group: OSPI startup and programming preparation
      files:
        - file: ospi_startup.c
        - file: ../../board/DevKit-E8/model_storage.c
        - file: ../../board/DevKit-E8/e8_issi_flash.c
    - group: Phonon TTS hardware benchmark
      for-context:
        - .Debug
        - .Release
      files:
        - file: app_main.cpp
        - file: phonon_psram.c
        - file: phonon_psram.h
        - file: model/benchmark_fixtures.h
    - group: Embedded ExecuTorch module
      for-context:
        - .Debug
        - .Release
      files:
        - file: ../../common/arm_embedded_module.cpp
        - file: ../../common/arm_embedded_module.hpp
    - group: Runtime memory allocation
      for-context: [.Debug, .Release]
      files:
        - file: ../../common/embedded_runtime.hpp
        - file: ../../common/nodes_impl/c/embedded_runtime.cpp
  layers:
    - layer: $Board-Layer$
      type: Board
    - layer: $AI-Layer$
      type: AI
      for-context:
        - .Debug
        - .Release
  output:
    type: [elf, bin, hex, map]
