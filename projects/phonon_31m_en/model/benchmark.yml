benchmarks:
  network:
    operation: Phonon q8 stateful TTS audio frame; backbone then synthesize, principal embedding input and PCM output; persistent
      states documented in method_manifest.json
    input_shape:
    - 1
    - 1
    - 512
    output_shape:
    - 1
    - 1
    - 1920
    samples_per_forward: 1920
    sample_rate_hz: 24000
    block_deadline_ms: 80
    float_boundary: true
    quantization: q8 GGUF source; int16 activations and int8 linear/convolution weights on U85; CPU float attention, normalization
      and state operations
  benchmark:
  - platform:
      os: RTX5
      cpu: Cortex-M55
      memory:
        weights:
          type: OSPI1 octal DDR flash
          clock_mhz: 25
          clock_source: SERVICES AXI clock 400 MHz divided by observed BAUDR 16
        activations:
          type: CPU planned tensors and persistent state in 64 MiB HyperRAM; U85 temporary scratch in SRAM0
          clock_mhz: 25
          clock_source: HyperRAM bus from SERVICES AXI clock 400 MHz divided by observed BAUDR 16; SRAM clock not represented
            here
    measurements:
      memory:
        model_bytes: 44675472
      time:
        ms: 59345
        statistic: mean
        forward_ms: 59345
        forward_timer_hz: 1000
        forward_ticks_samples:
        - 59345
        - 59345
    run:
      recorded_at: '2026-10-21T10:54:10Z'
      context: Shared_Sram baseline, 512-position Flow context. Two uninterrupted complete frames; source-derived HyperRAM
        wait 7, full 64 MiB physical RAM readback and full PTE/prefix/BOS CRC passed. Realtime FAIL at 741.8125 times the
        80 ms budget. Prefix copy 1101 ms, pinned 7-token prefill 206033 ms, neural time to first frame 266479 ms. Speech
        quality is not accepted and earlier same-binary first-token divergence remains unresolved. See shared_25mhz_result.json
        and gelu_compiler_trial.json.
      target: Alif E8 DevKit
      device: AE822FA0E5597LS0
      core: M55_HP
      npu: Ethos-U85-256
      compiler: AC6 armclang
      optimize: Release -O3 -ffast-math globally; Portable gelu source alone -fno-fast-math for measured correctness
      build_job: b-51
      execution_job: d-54 CMSIS Load and Debug
      cpu_clock_mhz: 400
      warmup: 0
      samples: 2
      pmu_cross_check: 61 delegated invocations per frame; raw U85 PMU cycles 517665738 and 517665835, overflow 0. Actual
        HG clock is not independently verified; time.ms is measured complete-frame wall time.
      pmu_overflow: 0
      npu_invocations_per_forward: 61
      test_result: FAIL
      max_absolute_error: 0.798779726
      uart: COM7 115200 baud
      model_sha256: cf07d603198495055f45bdc6eae73d119823c0d196cff65e4bf84c849844fab7
      firmware_sha256: 24f43dd1d73ce5728d73ed68f58058c4adf326f48733415247adca6e7f70b33a
      input: Hello from Phonon. pinned 7 token IDs, voice prefix 125, deterministic seed 20261021 noise at temperature 0.8;
        generated frames 0 and 1
      timing_scope: Complete backbone+synthesize, CPU state copies, bitwise finite checks, PCM16 conversion and handoff storage.
        Excludes UART normalization/tokenization, prefix copy/text prefill, physical audio playback, logging and latent/EOS/PCM
        reference comparisons. The hidden reference comparison is included for this first-two-frame diagnostic.
      uart_run: Phonon case=0 frame=0 ticks=59345 NPU=517665738 calls=61 EOS=-11.926210
      measurement_source: CMSIS serial capture and stopped-target variable inspection; model/shared_25mhz_result.json
