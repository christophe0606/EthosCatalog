network:
  name: rvTTS FARGAN hybrid (Ethos prosody/acoustic and CPU vocoder)
  model: model/shared_model.py
  quantize: model/quantize_shared.py
  quantization:
    type: post_training_quantization
    quantization: synthetic
    error:
      scheme: symmetric int16 activations and per-tensor int8 weights, PTQ; no training
      reference: PyTorch reconstruction of supplied int8-weight/float-activation C
      original_quantization_error: trained float weights and error are not supplied
        by upstream
      calibration: 8 synthetic phoneme/word sequences, 1 to 223 frames; MinMax with
        10% range guard
      evaluation: 4 independently seeded synthetic sequences, 2/19/81/157 frames
      methods:
        prosody_pre:
          calibration_calls: 25
          evaluation_calls: 10
          max_absolute_error: 0.00017356500029563904
