        final audio quality.
      original_four_region_gate:
        passed: true
        instruments: 13
        report: model/deployment_conditionals.json
        maximum_mean_top_p_total_variation: 0.00548664
        maximum_mean_expected_pitch_shift_cents: 0.0278409
        harmonic_relative_rmse_range:
        - 0.004885
        - 0.008227
