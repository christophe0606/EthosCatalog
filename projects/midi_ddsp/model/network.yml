        instruments: 13
        report: model/deployment_ptq_validation.json
        maximum_raw_normalized_rmse: 0.036154
        pitch_rmse_cents_range:
        - 1.485
        - 9.689
      demo_register_gate:
        passed: false
        report: model/demo_conditionals.json
        instrument_failing: tuba
        mean_expected_pitch_shift_cents: 0.120217
        gate_cents: 0.1
