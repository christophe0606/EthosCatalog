project:
  device: :M55_HP
  packs:
    - pack: ARM::CMSIS-RTX@^5.9.0
  add-path:
    - .
    - ../../common
    - ../../board/DevKit-E8
    - ../../board/DevKit-E8/RTE/Device/AE822FA0E5597LS0_M55_HP
    - ../../board/DevKit-E8/RTE/BSP/AE822FA0E5597LS0_M55_HP
  define:
    # The PTE is stored in OSPI and staged in SRAM0 before inference, matching
    # the reference chess application. The NPU reads the staged SRAM copy.
    - NPU_QCONFIG: 1
    - NPU_REGIONCFG_0: 1
    - NPU_REGIONCFG_1: 0
    - APP_METHOD_POOL_SIZE: 65536
    - APP_TEMP_POOL_SIZE: 65536
    - APP_POOL_SECTION: \".bss.ai_pool\"
  components:
    - component: BSP:OSPI FLASH XIP:core
    - component: CMSIS:RTOS2:Keil RTX5&Source
    - component: CMSIS:OS Tick:SysTick
    - component: CMSIS-Compiler:TTY:Custom
  connections:
    - connect: OSPI template application
      provides:
        - CMSIS-RTOS2
  linker:
    - script: linker_ac6.sct.src
      for-compiler: AC6
    - regions: ../../board/DevKit-E8/RTE/Device/AE822FA0E5597LS0_M55_HP/app_mem_regions.h
  misc:
    - for-compiler: AC6
      C: [-ffunction-sections, -fdata-sections]
      CPP: [-ffunction-sections, -fdata-sections]
      Link: [--remove]
    - CPP: [-std=gnu++17, -Wno-deprecated-declarations]
  groups:
    - group: OSPI startup and programming preparation
      files:
        - file: ospi_startup.c
        - file: ../../board/DevKit-E8/model_storage.c
        - file: ../../board/DevKit-E8/e8_issi_flash.c
    - group: OSPI template inference
      for-context:
        - .Debug
        - .Release
      files:
        - file: app_main.cpp
        - file: model/model_test_data.h
    - group: Embedded ExecuTorch module
      for-context:
        - .Debug
        - .Release
      files:
        - file: ../../common/arm_embedded_module.cpp
        - file: ../../common/arm_embedded_module.hpp
  layers:
    - layer: $Board-Layer$
      type: Board
    - layer: $AI-Layer$
      type: AI
      for-context:
        - .Debug
        - .Release
  output:
    type: [elf, bin, hex, map]
