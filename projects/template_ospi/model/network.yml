# Paths are relative to the project directory, one level above this file.
network:
  name: Template OSPI
  model: model/model.py
  quantize: model/quantize.py
  quantization:
    type: post_training_quantization
    quantization: synthetic
    # Maximum absolute output error vs float, before Vela, on the four
    # quantize.py calibration_inputs() patterns (2048 values, random seed 17).
    error:
      max_absolute_error: 3.039836883544922e-05
  safetensors: model/model_quantized.safetensors
  graph: model/model_quantized.pt2
  flash_ospi: true
  ospi:
    address: 0xC0000000
    size: 0x02000000
    pname: M55_HP
  vela:
    ini: ../../.cmsis/ensemble_vela.ini
    system_config: Ethos_U85_SRAM_OSPI
    memory_mode: Shared_Sram
