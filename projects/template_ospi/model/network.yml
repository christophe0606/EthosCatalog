# Paths are relative to the project directory, one level above this file.
network:
  name: Template OSPI
  model: model/model.py
  quantize: model/quantize.py
  safetensors: model/model_quantized.safetensors
  graph: model/model_quantized.pt2
  flash_ospi: true
  ospi:
    address: 0xC0000000
    size: 0x02000000
    pname: M55_HP
  vela:
    ini: ../../.cmsis/ensemble_vela.ini
    system_config: Ethos_U85_SRAM_OSPI
    memory_mode: Shared_Sram
